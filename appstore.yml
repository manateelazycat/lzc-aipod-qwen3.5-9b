  en:
    id: 0
    name: Qwen 3.5 9B
    brief: Native CUDA + lossless MTP speculative decoding multimodal LLM optimized for Jetson AGX Thor (SM110a) and AGX Orin 64GB (SM87 / JetPack 7)
    description: |
      Qwen 3.5 9B (Defiant Fable Uncensored Heretic NEO-IMATRIX-MAX-MTP) is a multimodal LLM deeply optimized for LazyCat AI Pod across AGX Thor and AGX Orin 64GB, supporting vision understanding, reasoning, OpenAI tool calling, and 16K–256K context:
      - AGX Thor (T5000 / Dev / T4000, sm_110a): 20 rounds of Nsight-driven CUDA optimization with lossless native MTP (Q2_K shadow draft head + exact BF16 target verification) and 2CTA cuBLAS FP16 prefill; 60.92 TPS C=1 (peak 70.49 TPS, thinking 65.70 TPS), 2,874 TPS 4K cold prefill, 199–209 TPS at C=8
      - AGX Orin 64GB (JetPack 7 / sm_87): Unlocked Ampere sm_87 Tensor Core MMA Gated DeltaNet and Q2_K 1-row/warp MMVQ; 43.23 TPS C=1 (peak 50.57–53.94 TPS, ~2x speedup), 1,020 TPS 4K cold prefill, 256K context with 29.4 GiB free UMA and zero OOM
      - Pure FROM scratch offline runtime (~572 MiB, zero bundled weights, zero Python/compilers) integrated with AI Pod Model Store, OpenAI API, Pi Agent, and /metrics token accounting
    keywords: Qwen,Qwen 3.5,9B,AI Pod,AGX Thor,AGX Orin,MTP,Multimodal,LLM
